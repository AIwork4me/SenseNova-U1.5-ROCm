name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Offline unit tests (manifest, receipts, CLI surface)
        run: |
          python3 -m pip install pytest -q
          python3 -m pytest tests/ -v
      - name: ShellCheck the pipeline scripts
        run: |
          sudo apt-get install -y shellcheck -q
          shellcheck scripts/*.sh scripts/lib/common.sh
